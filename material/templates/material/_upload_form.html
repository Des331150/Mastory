{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="upload" method="post" enctype="multipart/form-data"
      action="{% url 'course-create' %}"
      hx-post="{% url 'course-create' %}" hx-encoding="multipart/form-data"
      hx-swap="none">
  {% csrf_token %}
  <label for="id_title">Course title</label>
  <input id="id_title" type="text" name="title" placeholder="e.g. MATH 201 Linear Algebra" />

  <label for="id_files">Course PDFs</label>
  <input id="id_files" type="file" name="files" accept="application/pdf" multiple required />

  <button type="submit">Upload and read</button>
  <ol class="upload-stages" aria-label="What happens to each file">
    <li>Reading pages</li>
    <li>Converting</li>
    <li>Verifying</li>
  </ol>
  <p class="muted small">Each file goes through these three stages in turn. A file that
    cannot be read says so and leaves the others alone.</p>
</form>
